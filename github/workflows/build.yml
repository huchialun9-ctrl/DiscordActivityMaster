name: Build and Release DAM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 下載程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: 安裝相依模組
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 編譯 Windows 執行檔 (PyInstaller)
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "DAM" main.py

    - name: 上傳打包二進位檔案
      uses: actions/upload-artifact@v4
      with:
        name: DAM-Windows-Build
        path: dist/DAM/
